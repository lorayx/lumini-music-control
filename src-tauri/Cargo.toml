[package]
name = "lumini-music-control"
version = "0.11.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lorayx/lumini-music-control"
rust-version = "1.90"
description = "A Windows tray controller for Yandex Music"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
base64 = "0.22"
windows-future = "0.3"
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Storage_Streams", "UI_ViewManagement", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Registry", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false



